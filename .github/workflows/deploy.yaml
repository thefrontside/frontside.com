name: deploy

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - production

jobs:
  # --- PULL REQUEST PREVIEW DEPLOYMENT ---
  deploy-preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: preview
      url: ${{ steps.netlify.outputs.preview-url }}
    permissions:
      id-token: write
      contents: read
      pull-requests: write # Required if you want to write a comment on the PR

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup Deno
      uses: denoland/setup-deno@v2
      with:
        deno-version: v2.x

    - name: Serve Website
      run: |
        deno task start &
        until curl --output /dev/null --silent --head --fail http://127.0.0.1:8005; do
          printf '.'
          sleep 1
        done
      env:
        SIMPLECAST_API: ${{ secrets.SIMPLECAST_API }}
        UMAMI_WEBSITE_ID: ${{ secrets.UMAMI_WEBSITE_ID }}
        PAGE_SENSE_SCRIPT_SRC: ${{ secrets.PAGE_SENSE_SCRIPT_SRC }}
      timeout-minutes: 5

    - name: Download Staticalize
      run: |
        wget https://github.com/thefrontside/staticalize/releases/download/v0.2.2/staticalize-linux.tar.gz \
          -O /tmp/staticalize-linux.tar.gz
        tar -xzf /tmp/staticalize-linux.tar.gz -C /usr/local/bin
        chmod +x /usr/local/bin/staticalize-linux

    - name: Staticalize
      run: |
        staticalize-linux \
          --site=http://127.0.0.1:8005 \
          --output=built \
          --base=https://frontside.com

    - name: Deploy Preview
      id: netlify
      run: |
        # Run CLI deploy WITHOUT the --prod flag to create a preview instance
        OUTPUT=$(npx netlify-cli deploy --dir=built --auth=${{ secrets.NETLIFY_AUTH_TOKEN }} --site=${{ secrets.NETLIFY_SITE_ID }})
        
        # Parse out the dynamic website URL from Netlify's terminal response
        URL=$(echo "$OUTPUT" | grep -oE "https://[^ ]+\.netlify\.app" | head -n 1)
        echo "preview-url=$URL" >> $GITHUB_OUTPUT

    # Automatically post the link as a comment inside the PR thread
    - name: Comment PR with Preview Link
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `🚀 **Deploy Preview Ready!** Review changes here: ${{ steps.netlify.outputs.preview-url }}`
          })

  # --- PRODUCTION DEPLOYMENT ---
  deploy-production:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://frontside.com
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Serve Website
        run: |
          deno task start &
          until curl --output /dev/null --silent --head --fail http://127.0.0.1:8005; do
            printf '.'
            sleep 1
          done
        env:
          SIMPLECAST_API: ${{ secrets.SIMPLECAST_API }}
          UMAMI_WEBSITE_ID: ${{ secrets.UMAMI_WEBSITE_ID }}
          PAGE_SENSE_SCRIPT_SRC: ${{ secrets.PAGE_SENSE_SCRIPT_SRC }}
        timeout-minutes: 5

      - name: Download Staticalize
        run: |
          wget https://github.com/thefrontside/staticalize/releases/download/v0.2.2/staticalize-linux.tar.gz \
            -O /tmp/staticalize-linux.tar.gz
          tar -xzf /tmp/staticalize-linux.tar.gz -C /usr/local/bin
          chmod +x /usr/local/bin/staticalize-linux

      - name: Staticalize
        run: |
          staticalize-linux \
            --site=http://127.0.0.1:8005 \
            --output=built \
            --base=https://frontside.com

      - name: Deploy to Production
        run: |
          npx netlify-cli deploy \
            --dir=built \
            --prod \
            --auth=${{ secrets.NETLIFY_AUTH_TOKEN }} \
            --site=${{ secrets.NETLIFY_SITE_ID }}
